name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# CVE-2026-114938: mitigate the vulnerable JDK Base64 intrinsic in CI.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check effective Java4Shell JVM workaround
        shell: bash
        run: |
          set -euo pipefail
          java -XX:+PrintFlagsFinal -version 2>&1 | grep -E 'UseBASE64Intrinsics[[:space:]]+=[[:space:]]+false'
      - name: Build and test
        run: mvn --batch-mode --update-snapshots verify
